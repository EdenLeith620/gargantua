<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<title>GARGANTUA — Schwarzschild Black Hole Raytracer</title>
<meta name="description" content="实时史瓦西黑洞零测地线光线追踪：事件视界、光子环、多次吸积盘穿越、引力透镜、多普勒增亮与引力红移，全部由单个全屏 Fragment Shader 现场积分。" />

<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff8b3d'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='3.4' fill='none' stroke='%23ff8b3d' stroke-width='1.6'/%3E%3C/svg%3E" />

<!-- No bundler, no build step: bare "three" resolves to the vendored ESM build. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
</head>

<body>
  <!-- The black hole is drawn here. One full-screen quad, one fragment shader. -->
  <canvas id="gl" aria-label="Schwarzschild black hole realtime raytracer"></canvas>

  <!-- The whole HUD is generated by js/hud.js into this container. -->
  <div id="ui"></div>

  <!-- Only shown if WebGL is genuinely unavailable or the context dies for good. -->
  <div id="fallback" hidden></div>

  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#dde6f2;font-family:sans-serif">
      <p>GARGANTUA 需要启用 JavaScript 与 WebGL2。</p>
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
